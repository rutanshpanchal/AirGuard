<!DOCTYPE html><html><head><title>AirGuard Device Login</title><style>

body{
font-family:Segoe UI;
background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
height:100vh;
display:flex;
justify-content:center;
align-items:center;
color:white;
}

.loginBox{
background:rgba(255,255,255,0.08);
padding:40px;
border-radius:15px;
width:320px;
text-align:center;
backdrop-filter:blur(12px);
}

input{
width:90%;
padding:10px;
margin:10px;
border:none;
border-radius:6px;
}

button{
padding:10px 20px;
border:none;
border-radius:6px;
background:#00e6e6;
cursor:pointer;
font-weight:bold;
}

</style></head><body><div class="loginBox"><h2>AirGuard Device Login</h2><input id="deviceID" placeholder="Device ID (example: esp32)">
<input id="username" placeholder="Username">
<input id="password" type="password" placeholder="Password"><button onclick="login()">Access Device</button>

</div><script>

function login(){

let device=document.getElementById("deviceID").value.trim();
let user=document.getElementById("username").value.trim();
let pass=document.getElementById("password").value.trim();

if(device=="" || user=="" || pass==""){
alert("Please enter all fields");
return;
}

/* redirect to dashboard with device id */

window.location.href="dashboard.html?device="+device;

}

</script></body></html>
